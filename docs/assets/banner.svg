<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">CLAN — Cooperative LLM Access Network</title>
  <desc id="desc">OpenCode and OpenAI SDK clients send requests with CLAN keys to one CLAN gateway, which routes them across a pool of Codex accounts. One account is in cooldown and receives no traffic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131b3a"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="750" y1="0" x2="990" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="400" rx="24"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .caption { fill: #7d8aa8; font-size: 14px; letter-spacing: 2px; }
    .pill { fill: #151d3b; stroke: #2e3a6e; stroke-width: 1.5; }
    .label { fill: #e6edf3; font-size: 17px; }
    .flow { fill: none; stroke: url(#edge); stroke-width: 2; stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .idle { fill: none; stroke: #3b4675; stroke-width: 2; stroke-dasharray: 2 8; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#dots)"/>
    <circle cx="860" cy="200" r="230" fill="url(#glow)"/>

    <text x="72" y="106" class="mono" font-size="16" letter-spacing="4" fill="#8b9cff">SELF-HOSTED LLM GATEWAY</text>
    <text x="66" y="222" class="sans" font-size="120" font-weight="800" letter-spacing="4" fill="url(#word)">CLAN</text>
    <text x="72" y="270" class="sans" font-size="26" fill="#c9d1d9">Cooperative LLM Access Network</text>
    <text x="72" y="318" class="mono" font-size="17" fill="#7d8aa8">one endpoint · many accounts · your keys</text>

    <text x="670" y="86" class="mono caption" text-anchor="middle">CLIENTS</text>
    <text x="1065" y="86" class="mono caption" text-anchor="middle">CODEX ACCOUNTS</text>

    <path class="flow" d="M750 152 C778 152 772 185 800 185"/>
    <path class="flow" d="M750 248 C778 248 772 215 800 215"/>
    <path class="flow" d="M920 190 C955 190 955 130 990 130"/>
    <path class="flow" d="M920 200 L990 200"/>
    <path class="idle" d="M920 210 C955 210 955 270 990 270"/>

    <rect class="pill" x="590" y="129" width="160" height="46" rx="23"/>
    <text x="670" y="158" class="sans label" text-anchor="middle">OpenCode</text>
    <rect class="pill" x="590" y="225" width="160" height="46" rx="23"/>
    <text x="670" y="254" class="sans label" text-anchor="middle">OpenAI SDK</text>

    <rect x="800" y="145" width="120" height="110" rx="20" fill="#1a2350" stroke="url(#edge)" stroke-width="2"/>
    <text x="860" y="196" class="sans" font-size="24" font-weight="800" letter-spacing="2" fill="#ffffff" text-anchor="middle">CLAN</text>
    <text x="860" y="222" class="mono" font-size="12.5" fill="#9aa6c7" text-anchor="middle">/v1/responses</text>

    <rect class="pill" x="990" y="108" width="150" height="44" rx="22"/>
    <circle cx="1012" cy="130" r="5" fill="#3fb950"/>
    <text x="1072" y="136" class="sans label" text-anchor="middle">Codex · A</text>
    <rect class="pill" x="990" y="178" width="150" height="44" rx="22"/>
    <circle cx="1012" cy="200" r="5" fill="#3fb950"/>
    <text x="1072" y="206" class="sans label" text-anchor="middle">Codex · B</text>
    <rect class="pill" x="990" y="248" width="150" height="44" rx="22" opacity="0.6"/>
    <circle cx="1012" cy="270" r="5" fill="#d29922"/>
    <text x="1072" y="276" class="sans label" text-anchor="middle" opacity="0.6">Codex · C</text>
    <text x="1065" y="318" class="mono" font-size="14" letter-spacing="1" fill="#d29922" text-anchor="middle">cooldown</text>
  </g>
</svg>
