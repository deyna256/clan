name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: clan
          POSTGRES_PASSWORD: clan-test
          POSTGRES_DB: clan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clan -d clan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAN_TEST_POSTGRES_DSN: postgres://clan:clan-test@127.0.0.1:5432/clan_test?sslmode=disable
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Check formatting
        run: just format --check

      - name: Check dependencies
        run: just deps

      - name: Run static analysis
        run: just lint

      - name: Run tests
        run: just test
